name: Fetch P90-1 interim video (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Download P90-1 video
        run: |
          mkdir -p assets/video
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PAGE_URL="https://tmpfiles.org/wxApJojjuFq0/p90-1--.mp4"
          curl -s -c /tmp/tmpfiles-cookies.txt -b /tmp/tmpfiles-cookies.txt -A "$UA" -e "$PAGE_URL" "$PAGE_URL" -o /tmp/tmpfiles-page.html
          ls -l /tmp/tmpfiles-page.html
          DL_PATH=$(grep -oE '/dl/[^"]*\.mp4' /tmp/tmpfiles-page.html | head -n 1)
          echo "Download path: $DL_PATH"
          test -n "$DL_PATH"
          curl -L --fail --retry 3 -c /tmp/tmpfiles-cookies.txt -b /tmp/tmpfiles-cookies.txt -A "$UA" -e "$PAGE_URL" -o assets/video/p90-1-product.mp4 "https://tmpfiles.org$DL_PATH"
          ls -l assets/video/p90-1-product.mp4
          file assets/video/p90-1-product.mp4 || true
          head -c 400 assets/video/p90-1-product.mp4 | cat -v || true
          echo
          test "$(stat -c%s assets/video/p90-1-product.mp4)" = "18365143"
      - name: Commit video
        run: |
          git config user.name "cheehwayan"
          git config user.email "cheehwayan2026@gmail.com"
          git add assets/video/p90-1-product.mp4
          git commit -m "feat(video): add interim P90-1 product video" || echo "nothing to commit"
          git push
